services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: antisludge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d antisludge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anti-sludge-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: anti-sludge-api:latest
    restart: unless-stopped
    environment:
      - DB_USER=admin
      - DB_PASS=secret
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=antisludge
      - DB_SSLMODE=disable
      - DEBUG=True
    # Em produção: remova a exposição direta de porta da API.
    # Acesso externo deve passar exclusivamente pelo nginx.
    # ports:
    #   - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anti-sludge-net

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    image: anti-sludge-web:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    # Em produção: remova a exposição direta de porta do Web.
    # Acesso externo deve passar exclusivamente pelo nginx.
    # ports:
    #   - "3000:3000"
    depends_on:
      - api
    networks:
      - anti-sludge-net

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    image: anti-sludge-nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"   # HTTP local (use sysctl para 80:80 em produção com portas livres)
      - "8443:443"  # HTTPS local
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - anti-sludge-net

  certbot:
    image: infinityofspace/certbot_dns_duckdns:latest
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --dns-duckdns --dns-duckdns-token ${DUCKDNS_TOKEN}; sleep 12h & wait $${!}; done;'"
    networks:
      - anti-sludge-net


  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - anti-sludge-net
    profiles:
      - tunnel  # Não sobe por padrão — use: podman compose --profile tunnel up -d

networks:
  anti-sludge-net:
    driver: bridge

volumes:
  postgres_data:
