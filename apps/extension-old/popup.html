<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      width: 360px;
      max-height: 500px;
      overflow-y: auto;
      background: #0f1923;
      color: #e0e6ed;
    }

    /* Scrollbar */
    body::-webkit-scrollbar {
      width: 5px;
    }
    body::-webkit-scrollbar-track {
      background: #0f1923;
    }
    body::-webkit-scrollbar-thumb {
      background: #1e3a5f;
      border-radius: 10px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0a2846 0%, #1a4a7a 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e3a5f;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #4fc3f7, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.active {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .status-badge.inactive {
      background: rgba(255, 82, 82, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }

    /* Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2a3a4a;
      border-radius: 26px;
      transition: all 0.3s ease;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      bottom: 3px;
      background: #7a8a9a;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: linear-gradient(135deg, #1b8a5a, #00e676);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(22px);
      background: #ffffff;
    }

    /* Session Info Bar */
    .session-info {
      padding: 10px 20px;
      background: #111f2e;
      border-bottom: 1px solid #1a2f45;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .session-timer {
      font-weight: 600;
      color: #4fc3f7;
      font-variant-numeric: tabular-nums;
    }

    .session-pages-count {
      color: #7a8a9a;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state .title {
      font-size: 14px;
      font-weight: 600;
      color: #7a8a9a;
      margin-bottom: 6px;
    }

    .empty-state .subtitle {
      font-size: 12px;
      color: #4a5a6a;
      line-height: 1.5;
    }

    /* Timeline */
    .timeline {
      padding: 16px 20px;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
      position: relative;
      padding-bottom: 16px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    /* Timeline connector line */
    .timeline-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 24px;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1e5a8a;
      border: 2px solid #4fc3f7;
      flex-shrink: 0;
      z-index: 1;
      margin-top: 4px;
    }

    .timeline-item:last-child .timeline-dot {
      background: #00e676;
      border-color: #00e676;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }

    .timeline-connector {
      width: 2px;
      flex-grow: 1;
      background: linear-gradient(180deg, #1e3a5f 0%, #1a2f45 100%);
      margin-top: 4px;
    }

    .timeline-item:last-child .timeline-connector {
      display: none;
    }

    /* Card */
    .timeline-card {
      flex: 1;
      background: #141f2e;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 10px 12px;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .timeline-card:hover {
      border-color: #2a5a8a;
      background: #182838;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #e0e6ed;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 10px;
      color: #4a6a8a;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-tag {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(79, 195, 247, 0.08);
      color: #4fc3f7;
    }

    .meta-tag.clicks {
      background: rgba(255, 183, 77, 0.08);
      color: #ffb74d;
    }

    .meta-tag.scroll-yes {
      background: rgba(0, 230, 118, 0.08);
      color: #00e676;
    }

    .meta-tag.scroll-no {
      background: rgba(255, 82, 82, 0.08);
      color: #ff5252;
    }

    /* Order number */
    .card-order {
      font-size: 9px;
      font-weight: 700;
      color: #4fc3f7;
      background: rgba(79, 195, 247, 0.1);
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      margin-bottom: 4px;
    }

    /* Footer */
    .footer {
      padding: 12px 20px;
      border-top: 1px solid #1a2f45;
      background: #111f2e;
      text-align: center;
      font-size: 10px;
      color: #3a4a5a;
    }

    /* Finished session banner */
    .finished-banner {
      padding: 10px 20px;
      background: rgba(0, 230, 118, 0.08);
      border-bottom: 1px solid rgba(0, 230, 118, 0.15);
      text-align: center;
      font-size: 12px;
      color: #00e676;
      font-weight: 500;
      display: none;
    }

    .finished-banner.visible {
      display: block;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .timeline-item {
      animation: fadeIn 0.3s ease forwards;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="logo">AntiSludge</span>
      <span id="statusBadge" class="status-badge inactive">Inativo</span>
    </div>
    <div class="toggle-container">
      <label class="toggle-switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- Finished Banner -->
  <div id="finishedBanner" class="finished-banner">
    ✅ Sessão finalizada — log baixado automaticamente
  </div>

  <!-- Session Info -->
  <div id="sessionInfo" class="session-info" style="display: none;">
    <span class="session-timer" id="sessionTimer">00:00</span>
    <span class="session-pages-count" id="pagesCount">0 páginas</span>
  </div>

  <!-- Timeline Content -->
  <div id="content">
    <div id="emptyState" class="empty-state">
      <div class="icon">🛡️</div>
      <div class="title">Extensão desativada</div>
      <div class="subtitle">Ative o rastreamento para monitorar<br>sua jornada em sites do governo</div>
    </div>
  </div>

  <!-- Timeline Container -->
  <div id="timeline" class="timeline" style="display: none;"></div>

  <!-- Footer -->
  <div class="footer">
    AntiSludge v1.0 — Rastreador de Jornada Digital
  </div>

  <script src="popup.js"></script>
</body>
</html>
