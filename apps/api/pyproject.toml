[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
tab-size = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py *_test.py"