name: 🏷️ Labels Setup

on:
  workflow_dispatch: # Permite rodar manualmente no painel Actions

jobs:
  create-labels:
    name: 🏷️ Ensure Labels Exist
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 🏷️ Create Missing Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'dependencies', color: '0366d6', description: 'Pull requests that update a dependency file' },
              { name: 'javascript', color: 'f1e05a', description: 'JavaScript/TypeScript related changes' },
              { name: 'python', color: '3572A5', description: 'Python related changes' },
              { name: 'ci', color: 'fbca04', description: 'CI/CD infrastructure changes' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Label "${label.name}" created.`);
              } catch (err) {
                if (err.status === 422) {
                  console.log(`Label "${label.name}" already exists.`);
                } else {
                  console.error(`Error creating label ${label.name}:`, err);
                }
              }
            }
