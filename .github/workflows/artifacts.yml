name: 📦 Build Artifacts

# Dispara após o release completar com sucesso no main,
# ou manualmente para builds ad-hoc.
on:
  workflow_run:
    workflows: ["🚀 Release & Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/versão para nomear os artefatos (ex: v1.2.0). Deixe vazio para usar o SHA."
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

# Só roda se o workflow pai teve sucesso (ou se foi disparado manualmente)
jobs:
  # ============================================================
  # GUARDA-CHUVA: verifica se o workflow pai teve sucesso
  # ============================================================
  check-trigger:
    name: ✅ Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔎 Verify upstream workflow succeeded
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve version
        id: version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "version=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
            else
              echo "version=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            fi
          fi

  # ============================================================
  # JOB 1: Extensão Chrome — ZIP
  # ============================================================
  extension-zip:
    name: 🧩 Extension ZIP
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 🛠️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Extension (Production)
        run: pnpm turbo build --filter extension
        env:
          PLASMO_PUBLIC_API_URL: ${{ secrets.PLASMO_PUBLIC_API_URL }}

      - name: 📁 Verify build output
        run: |
          if [ ! -d "apps/extension/build/chrome-mv3-prod" ]; then
            echo "❌ Build directory not found!"
            ls -la apps/extension/build/ || true
            exit 1
          fi
          echo "✅ Build output:"
          ls -la apps/extension/build/chrome-mv3-prod/

      - name: 🗜️ Create ZIP
        id: zip
        run: |
          VERSION="${{ needs.check-trigger.outputs.version }}"
          ZIP_NAME="antisludge-extension-${VERSION}-chrome.zip"
          cd apps/extension/build
          zip -r "../../../${ZIP_NAME}" chrome-mv3-prod/
          echo "zip-name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Created: ${ZIP_NAME} ($(du -sh "../../../${ZIP_NAME}" | cut -f1))"

      - name: 📤 Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ steps.zip.outputs.zip-name }}
          retention-days: 30

      - name: 🚀 Attach ZIP to GitHub Release
        if: startsWith(needs.check-trigger.outputs.version, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-trigger.outputs.version }}
          files: ${{ steps.zip.outputs.zip-name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2: Backend — Imagem OCI (Docker/Podman)
  # ============================================================
  api-image:
    name: 🐍 API Docker Image
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anti-sludge-api
          tags: |
            type=raw,value=${{ needs.check-trigger.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(needs.check-trigger.outputs.version, 'v') }}
            type=sha,prefix=sha-,format=short

      - name: 🔨 Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📋 Image digest
        run: |
          echo "## 🐍 API Image" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3: Frontend — Imagem OCI (Docker/Podman)
  # ============================================================
  web-image:
    name: 🌐 Web Docker Image
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anti-sludge-web
          tags: |
            type=raw,value=${{ needs.check-trigger.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(needs.check-trigger.outputs.version, 'v') }}
            type=sha,prefix=sha-,format=short

      - name: 🔨 Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://anti-sludge-gov.onrender.com/api/v1' }}

      - name: 📋 Image digest
        run: |
          echo "## 🌐 Web Image" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 4: Sumário final
  # ============================================================
  summary:
    name: 📋 Artifacts Summary
    needs: [check-trigger, extension-zip, api-image, web-image]
    if: always() && needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Write summary
        run: |
          VERSION="${{ needs.check-trigger.outputs.version }}"
          REGISTRY="${{ env.REGISTRY }}"
          OWNER="${{ env.IMAGE_OWNER }}"

          echo "# 📦 Build Artifacts — ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artefato | Status | Localização |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧩 Extensão Chrome | ${{ needs.extension-zip.result }} | GitHub Release + workflow artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 API Image | ${{ needs.api-image.result }} | \`${REGISTRY}/${OWNER}/anti-sludge-api:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web Image | ${{ needs.web-image.result }} | \`${REGISTRY}/${OWNER}/anti-sludge-web:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Como usar as imagens localmente (Podman)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${REGISTRY}/${OWNER}/anti-sludge-api:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${REGISTRY}/${OWNER}/anti-sludge-web:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
