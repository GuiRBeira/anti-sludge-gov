name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run releases (create tags & GitHub releases)
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =============================================
      # DEPLOYS CONDICIONAIS (só se o respectivo app mudou)
      # =============================================

      - name: Check if Web (Next.js) changed
        id: web-changed
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^apps/web/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Web to Vercel (if changed)
        if: steps.web-changed.outputs.changed == 'true'
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Check if API (FastAPI) changed
        id: api-changed
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^apps/api/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy API to Render (if changed)
        if: steps.api-changed.outputs.changed == 'true'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"