name: 🚀 Release & Quality

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------
  # JOB: Quality Check - Backend (API)
  # ---------------------------------------------------------
  quality-backend:
    name: 🐍 Backend Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: 🧱 Install Python Dependencies
        run: |
          cd apps/api
          pip install -r requirements-dev.txt

      - name: 🔍 Lint & Test Backend
        run: |
          cd apps/api
          python -m ruff check .
          python -m pytest
        env:
          PYTHONPATH: .

  # ---------------------------------------------------------
  # JOB: Quality Check - Frontend (Web)
  # ---------------------------------------------------------
  quality-frontend:
    name: 🌐 Web Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🛠️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌐 Lint & Test Web
        run: pnpm turbo lint test --filter web -- --passWithNoTests

  # ---------------------------------------------------------
  # JOB: Quality Check - Extension
  # ---------------------------------------------------------
  quality-extension:
    name: 🧩 Extension Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🛠️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧩 Lint & Test Extension
        run: pnpm turbo lint test --filter extension -- --passWithNoTests

  # ---------------------------------------------------------
  # JOB: Release & Deploy
  # ---------------------------------------------------------
  release:
    name: 🚀 Semantic Release & Deploy
    needs: [quality-backend, quality-frontend, quality-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🛠️ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏷️ Run Semantic Release
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # DEPLOYS ESTRATÉGICOS
      # =========================================================

      - name: 🔍 Check Web Changes
        id: web-changed
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^apps/web/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy Web to Vercel
        if: steps.web-changed.outputs.changed == 'true'
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: 🔍 Check API Changes
        id: api-changed
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^apps/api/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy API to Render
        if: steps.api-changed.outputs.changed == 'true'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"