events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    upstream web_backend {
        server web:3000;
    }

    upstream api_backend {
        server api:8000;
    }

    # ============================================================
    # Modo 1: Acesso direto (casa com port forward ou sysctl)
    # Redireciona HTTP → HTTPS e serve com certificado Let's Encrypt
    # ============================================================
    server {
        listen 80;
        server_name anti-sludge-gov.duckdns.org;

        # ACME challenge para renovação Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # Modo 1: HTTPS com Let's Encrypt
    # Usado quando há acesso direto nas portas 80/443
    # ============================================================
    server {
        listen 443 ssl;
        server_name anti-sludge-gov.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/anti-sludge-gov.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anti-sludge-gov.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        include /etc/nginx/conf.d/locations.conf;
    }

    # ============================================================
    # Modo 2: Cloudflare Tunnel (faculdade / rede restrita)
    # O cloudflared envia tráfego para nginx:80 internamente.
    # O TLS é terminado pela Cloudflare — nginx recebe HTTP puro.
    # Ativo quando cloudflared aponta para http://nginx:80
    # ============================================================
    server {
        listen 80 default_server;
        server_name _;  # Aceita qualquer host (tráfego interno do tunnel)

        # Confia nos headers reais enviados pela Cloudflare
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        include /etc/nginx/conf.d/locations.conf;
    }
}
