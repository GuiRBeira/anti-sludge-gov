events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Otimizações
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    upstream web_backend {
        server web:3000;
    }

    upstream api_backend {
        server api:8000;
    }

    # Redirecionamento HTTP para HTTPS
    server {
        listen 80;
        server_name anti-sludge-gov.duckdns.org;
        
        location / {
            return 301 https://$host$request_uri;
        }

        # Mantendo para compatibilidade caso precise de validação HTTP no futuro
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # Bloco Principal HTTPS
    server {
        listen 443 ssl;
        server_name anti-sludge-gov.duckdns.org;

        # Certificados Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/anti-sludge-gov.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anti-sludge-gov.duckdns.org/privkey.pem;

        # Parâmetros SSL Otimizados
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Frontend (Next.js)
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API (FastAPI)
        location /api {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
